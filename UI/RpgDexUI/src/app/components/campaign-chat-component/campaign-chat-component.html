<div class="chat-container" [class.is-minimized]="isMinimized">
  <div class="chat-header" (click)="toggleMinimize()">
    <div class="chat-title">
      <i class="fa fa-comments"></i>
      <span>Bate-papo da Mesa</span>

      <span
        class="chat-unread-badge"
        *ngIf="isMinimized && unreadCount > 0"
        title="Novas mensagens"
      >
        {{ unreadCount }}
      </span>
    </div>

    <div class="chat-header-actions" (click)="$event.stopPropagation()">
      <button
        class="btn-icon btn-sm"
        type="button"
        (click)="toggleSearch()"
        title="Pesquisar mensagens"
      >
        <i class="fa fa-magnifying-glass"></i>
      </button>
      <button
        class="btn-icon btn-sm"
        type="button"
        (click)="toggleMinimize()"
        aria-label="Minimizar ou expandir chat"
      >
        <i class="fa" [ngClass]="isMinimized ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
      </button>
    </div>
  </div>

  <div class="chat-body" *ngIf="!isMinimized">
    <!-- BARRA DE PESQUISA -->
    <div class="chat-search-bar" *ngIf="showSearchInput">
      <i class="fa fa-magnifying-glass search-icon"></i>
      <input
        type="text"
        class="search-input"
        placeholder="Filtrar mensagens..."
        [(ngModel)]="searchQuery"
        (ngModelChange)="onSearchChange()"
      />
      <button
        class="btn-clear-search"
        *ngIf="searchQuery"
        (click)="searchQuery = ''; onSearchChange()"
      >
        <i class="fa fa-xmark"></i>
      </button>
    </div>

    <div class="messages-container" #scrollContainer>
      <!-- Estado de Carregamento Inicial -->
      <div class="chat-empty" *ngIf="isInitialLoading">
        <i class="fa fa-spinner fa-spin"></i>
        <span>Carregando conversas...</span>
      </div>

      <!-- Estado Vazio -->
      <div class="chat-empty" *ngIf="!isInitialLoading && messages.length === 0">
        <i class="fa fa-comment-dots"></i>
        <span>Nenhuma mensagem encontrada.</span>
      </div>

      <!-- Botão para Carregar Histórico -->
      <div class="load-more-container" *ngIf="hasMore && messages.length > 0">
        <button
          class="btn-load-more"
          type="button"
          (click)="loadMoreMessages()"
          [disabled]="isLoadingMore"
        >
          <i class="fa" [ngClass]="isLoadingMore ? 'fa-spinner fa-spin' : 'fa-history'"></i>
          <span>{{ isLoadingMore ? 'Carregando...' : 'Carregar mensagens anteriores' }}</span>
        </button>
      </div>

      <!-- Lista de Mensagens -->
      <div
        *ngFor="let msg of messages"
        class="message-item"
        [class.message-mine]="isMyMessage(msg)"
      >
        <div
          class="message-avatar"
          [style.background-image]="msg.userIcon ? 'url(' + msg.userIcon + ')' : ''"
        >
          <i class="fa fa-user" *ngIf="!msg.userIcon"></i>
        </div>

        <div class="message-content">
          <div class="message-meta">
            <span class="message-author">{{ msg.username }}</span>
            <span class="message-time" *ngIf="msg.sentAt">
              {{ msg.sentAt | date: 'HH:mm' }}
            </span>
          </div>

          <!-- MODO EDIÇÃO INLINE DA MENSAGEM -->
          <ng-container *ngIf="editingMessageId === msg.id; else displayBubble">
            <div class="edit-message-box">
              <input
                type="text"
                class="edit-message-input"
                [(ngModel)]="editingText"
                maxlength="500"
                (keydown.enter)="saveEdit(msg.id)"
                (keydown.escape)="cancelEdit()"
              />
              <div class="edit-actions">
                <button
                  type="button"
                  class="btn-icon-action btn-check"
                  (click)="saveEdit(msg.id)"
                  title="Salvar alteração"
                >
                  <i class="fa fa-check"></i>
                </button>
                <button
                  type="button"
                  class="btn-icon-action btn-cancel"
                  (click)="cancelEdit()"
                  title="Cancelar"
                >
                  <i class="fa fa-xmark"></i>
                </button>
              </div>
            </div>
          </ng-container>

          <!-- BALÃO NORMAL DA MENSAGEM -->
          <ng-template #displayBubble>
            <div class="message-bubble">
              {{ msg.data }}
            </div>
          </ng-template>
        </div>

        <!-- AÇÕES FLUTUANTES NO HOVER PARA MENSAGENS DO PRÓPRIO USUÁRIO -->
        <div class="message-hover-actions" *ngIf="isMyMessage(msg) && editingMessageId !== msg.id">
          <button
            type="button"
            class="btn-hover-action"
            (click)="startEditing(msg)"
            title="Editar mensagem"
          >
            <i class="fa fa-pen"></i>
          </button>
          <button
            type="button"
            class="btn-hover-action"
            (click)="restorePreviousVersion(msg)"
            title="Restaurar versão anterior"
          >
            <i class="fa fa-rotate-left"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- CONTROLES E FORMULÁRIO COM SELETOR DE PERSONA -->
    <div class="chat-controls">
      <!-- Seletor de Persona (Perfil / Personagem) -->
      <div class="persona-selector-wrap" *ngIf="myCharacters.length > 0">
        <label class="persona-label">
          <i class="fa fa-mask"></i>
          <span>Enviar como:</span>
        </label>
        <select class="persona-select" [(ngModel)]="selectedCharacterId">
          <option [ngValue]="null">Mestre / Meu Perfil</option>
          <option *ngFor="let char of myCharacters" [ngValue]="char.id">🎭 {{ char.name }}</option>
        </select>
      </div>

      <form (ngSubmit)="send()" class="chat-form">
        <input
          #chatInput
          class="chat-input"
          type="text"
          name="newMessageText"
          [(ngModel)]="newMessageText"
          placeholder="Digite sua mensagem..."
          maxlength="500"
          autocomplete="off"
          [disabled]="isSending"
        />
        <button
          class="btn btn-primary btn-send"
          type="submit"
          [disabled]="!newMessageText.trim() || isSending"
        >
          <i class="fa" [ngClass]="isSending ? 'fa-spinner fa-spin' : 'fa-paper-plane'"></i>
        </button>
      </form>

      <div class="chat-error-toast" *ngIf="sendError">
        <i class="fa fa-circle-exclamation"></i>
        <span>{{ sendError }}</span>
      </div>
    </div>
  </div>
</div>
