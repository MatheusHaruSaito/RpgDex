<div class="canvas-fullscreen-wrapper">
  <!-- BARRA SUPERIOR -->
  <div class="canvas-ui canvas-topbar">
    <div style="display: flex; gap: 8px; align-items: center">
      <button
        class="btn btn-secondary btn-sm"
        [routerLink]="['/campanha', campaignId]"
        style="margin-right: 8px"
      >
        <i class="fa fa-arrow-left"></i> Voltar
      </button>

      <!-- Controlos de Histórico -->
      <button
        class="btn btn-secondary btn-sm"
        (click)="undo()"
        [disabled]="history.length === 0"
        title="Desfazer (Ctrl+Z)"
      >
        <i class="fa fa-rotate-left"></i>
      </button>
      <button
        class="btn btn-secondary btn-sm"
        (click)="redo()"
        [disabled]="redoHistory.length === 0"
        title="Refazer (Ctrl+Y)"
      >
        <i class="fa fa-rotate-right"></i>
      </button>
    </div>

    <div class="canvas-brand"><i class="fa fa-chess-board"></i> Tabuleiro Virtual</div>

    <!-- Ocupa espaço fantasma para centralizar o título do tabuleiro -->
    <div style="width: 150px"></div>
  </div>

  <!-- TOOLBAR PRINCIPAL (LATERAL) -->
  <div class="canvas-ui canvas-toolbar">
    <div class="toolbar-group color-picker-wrap">
      <div
        ngx-colors-trigger
        [(ngModel)]="selectedColor"
        (ngModelChange)="onColorChange($event)"
        title="Escolher Cor"
        class="color-preview-btn"
        [style.backgroundColor]="selectedColor"
      ></div>
    </div>

    <div class="toolbar-group">
      <button
        class="tool-btn"
        [class.active]="activeTool === 'cursor'"
        (click)="setTool('cursor')"
        title="Selecionar / Mover"
      >
        <i class="fa fa-arrow-pointer"></i>
      </button>
      <button
        class="tool-btn"
        [class.active]="activeTool === 'draw'"
        (click)="setTool('draw')"
        title="Pincel"
      >
        <i class="fa fa-pen"></i>
      </button>
    </div>

    <div class="toolbar-group">
      <button class="tool-btn action" (click)="addToken()" title="Adicionar Token">
        <i class="fa fa-user-astronaut"></i>
      </button>
      <button class="tool-btn action" (click)="addText()" title="Adicionar Anotação">
        <i class="fa fa-font"></i>
      </button>
      <button class="tool-btn action" (click)="triggerImageUpload()" title="Adicionar Imagem">
        <i class="fa fa-image"></i>
      </button>
      <input type="file" #fileInput hidden accept="image/*" (change)="onImageSelected($event)" />
    </div>

    <div class="toolbar-group">
      <button class="tool-btn" (click)="zoomIn()"><i class="fa fa-plus"></i></button>
      <span class="zoom-text">{{ scale * 100 | number: '1.0-0' }}%</span>
      <button class="tool-btn" (click)="zoomOut()"><i class="fa fa-minus"></i></button>
      <button class="tool-btn" (click)="centerCamera()"><i class="fa fa-expand"></i></button>
    </div>
  </div>

  <!-- MENU DE CONTEXTO DO ELEMENTO(S) SELECIONADO(S) -->
  <div
    class="canvas-ui context-menu"
    *ngIf="selectedElements.length > 0 && activeTool === 'cursor'"
  >
    <div class="context-info">
      <strong>Editando:</strong>
      {{
        selectedElements.length === 1
          ? (getElementTypeName(selectedElements[0].elementType) | uppercase)
          : selectedElements.length + ' ITENS'
      }}
    </div>

    <div class="context-actions">
      <!-- Opções exclusivas para quando há apenas 1 imagem/token selecionado -->
      <ng-container *ngIf="selectedElements.length === 1">
        <button
          *ngIf="selectedElements[0].elementType === CanvasElementType.Image"
          class="btn btn-secondary btn-sm"
          (click)="startCropping()"
          title="Cortar Imagem"
        >
          <i class="fa fa-crop-simple"></i> Cortar
        </button>

        <div
          class="context-range"
          *ngIf="selectedElements[0].elementType === CanvasElementType.Image || selectedElements[0].elementType === CanvasElementType.Token"
        >
          <i class="fa fa-down-left-and-up-right-to-center"></i>
          <input
            type="range"
            min="0.2"
            max="5"
            step="0.1"
            [value]="selectedElements[0].scale"
            (input)="updateElementScale($event)"
            (change)="updateElementAPI(selectedElements[0])"
          />
        </div>
      </ng-container>

      <!-- Controle de Camadas e Ações em Massa -->
      <button
        class="btn btn-secondary btn-sm layer-btn"
        (click)="bringForward()"
        title="Trazer para a Frente"
      >
        <i class="fa fa-arrow-up"></i> Frente
      </button>
      <button
        class="btn btn-secondary btn-sm layer-btn"
        (click)="sendBackward()"
        title="Enviar para Trás"
      >
        <i class="fa fa-arrow-down"></i> Fundo
      </button>

      <div class="divider"></div>

      <!-- Excluir -->
      <button
        class="btn-icon context-icon-btn danger"
        (click)="deleteSelected()"
        title="Apagar (Del)"
      >
        <i class="fa fa-trash"></i>
      </button>
    </div>
  </div>

  <!-- CAIXA DE SELEÇÃO MÚLTIPLA -->
  <div
    *ngIf="selectionBox.active"
    class="selection-box"
    [style.left.px]="getMin(selectionBox.startX, selectionBox.currentX)"
    [style.top.px]="getMin(selectionBox.startY, selectionBox.currentY)"
    [style.width.px]="getAbs(selectionBox.currentX - selectionBox.startX)"
    [style.height.px]="getAbs(selectionBox.currentY - selectionBox.startY)"
  ></div>

  <!-- MODAL DE CORTE DE IMAGEM -->
  <div class="cropper-backdrop" *ngIf="isCropping">
    <div class="cropper-card">
      <div class="cropper-header">
        <h3>Ajustar Imagem</h3>
        <!-- Controle de Formato -->
        <div class="crop-shape-toggles">
          <button class="shape-btn" [class.active]="!isRoundCrop" (click)="setCropShape(false)">
            <i class="fa fa-square"></i> Quadrado
          </button>
          <button class="shape-btn" [class.active]="isRoundCrop" (click)="setCropShape(true)">
            <i class="fa fa-circle"></i> Redondo
          </button>
        </div>
      </div>

      <div class="cropper-body">
        <image-cropper
          *ngIf="cropImageSource"
          [imageBase64]="isBase64Url(cropImageSource) ? cropImageSource : ''"
          [imageURL]="!isBase64Url(cropImageSource) ? cropImageSource : ''"
          [maintainAspectRatio]="isRoundCrop"
          [aspectRatio]="1"
          [roundCropper]="isRoundCrop"
          format="png"
          (imageCropped)="imageCropped($event)"
        ></image-cropper>
      </div>

      <div class="cropper-footer">
        <button class="btn btn-secondary" (click)="cancelCrop()">Cancelar</button>
        <button class="btn btn-primary" (click)="saveCrop()">
          <i class="fa fa-check"></i> Confirmar Corte
        </button>
      </div>
    </div>
  </div>

  <!-- ÁREA DE VISUALIZAÇÃO INFINITA -->
  <div class="canvas-viewport" #canvasContainer (pointerdown)="onPointerDown($event)">
    <div
      class="canvas-world"
      [style.transform]="'translate(' + panX + 'px, ' + panY + 'px) scale(' + scale + ')'"
    >
      <div class="grid-bg"></div>

      <ng-container *ngFor="let el of elements">
        <!-- DESENHOS -->
        <svg
          *ngIf="el.elementType === CanvasElementType.Drawing"
          class="board-element type-drawing"
          [style.z-index]="el.z"
          (pointerdown)="onElementDown($event, el)"
        >
          <path
            [class.selected-path]="selectedElements.includes(el)"
            [attr.d]="getSvgPath(el.points)"
            [attr.stroke]="el.color"
            [attr.stroke-width]="el.strokeWidth"
            fill="none"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>

        <!-- TOKEN -->
        <div
          *ngIf="el.elementType === CanvasElementType.Token"
          class="board-element type-token"
          [class.is-selected]="selectedElements.includes(el)"
          [style.left.px]="el.x"
          [style.top.px]="el.y"
          [style.z-index]="el.z"
          [style.transform]="'scale(' + el.scale + ')'"
          [style.background-color]="el.color"
          (pointerdown)="onElementDown($event, el)"
        >
          <span class="token-initial">{{ el.content?.charAt(0) }}</span>
          <div class="token-name-tag">{{ el.content }}</div>
        </div>

        <!-- TEXTO -->
        <div
          *ngIf="el.elementType === CanvasElementType.Text"
          class="board-element type-text"
          [class.is-selected]="selectedElements.includes(el)"
          [style.left.px]="el.x"
          [style.top.px]="el.y"
          [style.z-index]="el.z"
          [style.color]="el.color"
          (pointerdown)="onElementDown($event, el)"
        >
          {{ el.content }}
        </div>

        <!-- IMAGEM -->
        <div
          *ngIf="el.elementType === CanvasElementType.Image"
          class="board-element type-image"
          [class.is-selected]="selectedElements.includes(el)"
          [style.left.px]="el.x"
          [style.top.px]="el.y"
          [style.z-index]="el.z"
          [style.transform]="'scale(' + el.scale + ')'"
          (pointerdown)="onElementDown($event, el)"
        >
          <img [src]="el.imageUrl" draggable="false" />
        </div>
      </ng-container>
    </div>
  </div>
</div>
