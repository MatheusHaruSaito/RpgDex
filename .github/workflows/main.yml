name: .NET Core Build e Check

on:
  push:
    branches: [ "main","feat/**", "fix/**" ]
  pull_request:
    branches: ["main"]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: API/RpgDex

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore
      env:
        ConnectionStrings__MongoDbConnection: ${{ secrets.MONGODB_CONNECTION_STRING }}
        Jwt__Key: ${{  secrets.JWT_KEY  }}
  build-angular:
      runs-on: ubuntu-latest
      defaults:
        run:
          working-directory: UI/RpgDexUI
  
      steps:
      - uses: actions/checkout@v4
  
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: UI/RpgDexUI/package-lock.json
  
      - name: Install dependencies
        run: npm ci
  
      - name: Lint
        run: npm run lint --if-present
  
      - name: Build Angular
        run: npx ng build
